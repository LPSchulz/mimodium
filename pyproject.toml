[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "mimodium"
version = "0.0.2"
authors = [{ name = "Leonard Schulz", email = "leonard.schulz@tuhh.de" }]
description = "Reproducible system-level simulations for distributed massive MIMO research."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "MIMO",
    "wireless communications",
    "simulation",
    "reproducible research",
    "5G",
    "6G",
    "6G research",
    "system-level simulation",
    "open-source",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "matplotlib>=3.8,<4",
    "dagreon>=0.2.0",
]

[project.urls]
Documentation = "https://mimodium.readthedocs.io/"
Source = "https://github.com/LPSchulz/mimodium"
Issues = "https://github.com/LPSchulz/mimodium/issues"
Archive = "https://doi.org/10.5281/zenodo.22211987"

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]
docs = [
    "sphinx>=7,<9",
    "pydata-sphinx-theme>=0.15,<1",
    "sphinx-gallery>=0.18,<1",
    "sphinx-autodoc-typehints>=2,<4",
    "sphinx-copybutton>=0.5,<1",
    "sphinx-design>=0.6,<1",
]
dev = [
    "ruff>=0.8,<1",
    "pytest>=8,<10",
    "build>=1,<2",
    "twine>=7,<8",
    "sphinx>=7,<9",
    "pydata-sphinx-theme>=0.15,<1",
    "sphinx-gallery>=0.18,<1",
    "sphinx-autodoc-typehints>=2,<4",
    "sphinx-copybutton>=0.5,<1",
    "sphinx-design>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mimodium"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    # Mimodium uses standard telecom/math symbols such as l for AP indices and
    # O for the number of channel realizations.
    "E741",
]

[tool.ruff.lint.per-file-ignores]
"src/mimodium/**/__init__.py" = ["F401"]
