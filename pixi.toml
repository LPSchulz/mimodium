[workspace]
name = "mimodium"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.12,<3.15"

[pypi-dependencies]
mimodium = { path = ".", editable = true, extras = ["dev"] }

[tasks]
test = "pytest"
lint = "ruff check src tests docs scripts"
format = "ruff format src tests docs scripts"
format-check = "ruff format --check src tests docs scripts"
metadata-check = "python scripts/check_release_metadata.py"
docs-check = "sphinx-build -E -W --keep-going -b html docs docs/_build/html"
build = "python -m build"
dist-check = { cmd = "python -m twine check dist/*", depends-on = ["build"] }
release-check = { depends-on = [
    "metadata-check",
    "format-check",
    "lint",
    "test",
    "docs-check",
    "dist-check",
] }
